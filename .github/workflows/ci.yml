name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: npm run check
      - run: npm test
      - run: node --test ../scripts/ci/audit-npm-production.test.mjs
      - run: node ../scripts/ci/audit-npm-production.mjs .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node ../scripts/ci/audit-npm-production.mjs .
      - name: Validate release archive permissions
        working-directory: .
        shell: bash
        run: |
          archive="$RUNNER_TEMP/synapse-release-smoke.tar.gz"
          bash scripts/ci/package-release.sh \
            "20000101-000000-0000000" \
            "$archive"
          sha256sum -c "${archive}.sha256"
          frontend_mode="$(
            tar -tvzf "$archive" \
              | awk '$NF == "frontend/" { print substr($1, 1, 10) }' \
              | tail -n 1
          )"
          [[ "$frontend_mode" == "drwxr-xr-x" ]] \
            || { echo "Unsafe frontend directory mode: $frontend_mode"; exit 1; }
