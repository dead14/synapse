name: Deploy Production

on:
  workflow_run:
    workflows: ["Quality Gates"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: synapse-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ secrets.SYNAPSE_HOST }}
      DEPLOY_USER: ${{ secrets.SYNAPSE_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.SYNAPSE_SSH_PORT }}
      DEPLOY_KEY: ${{ secrets.SYNAPSE_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.SYNAPSE_SSH_KNOWN_HOSTS }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Keep in sync with the production runtime (see scripts/deploy/synapse-deploy).
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend release
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package release
        id: package
        shell: bash
        run: |
          release_id="$(date -u +'%Y%m%d-%H%M%S')-${RELEASE_SHA:0:12}"
          archive="release-${release_id}.tar.gz"
          bash scripts/ci/package-release.sh "$release_id" "$archive"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        shell: bash
        run: |
          : "${DEPLOY_HOST:?Missing SYNAPSE_HOST secret}"
          : "${DEPLOY_USER:?Missing SYNAPSE_DEPLOY_USER secret}"
          : "${DEPLOY_KEY:?Missing SYNAPSE_SSH_PRIVATE_KEY secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing SYNAPSE_SSH_KNOWN_HOSTS secret}"
          deploy_port="${DEPLOY_PORT:-22}"
          echo "DEPLOY_PORT_EFFECTIVE=$deploy_port" >> "$GITHUB_ENV"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host synapse-production
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $deploy_port
            IdentityFile $HOME/.ssh/id_ed25519
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Upload verified release
        shell: bash
        run: |
          archive="${{ steps.package.outputs.archive }}"
          for attempt in 1 2 3; do
            if scp \
              "$archive" "${archive}.sha256" \
              "synapse-production:/var/www/synapse-deploy/incoming/"; then
              exit 0
            fi
            echo "SCP attempt $attempt failed; retrying in 10 seconds" >&2
            sleep 10
          done
          exit 1

      - name: Record active release
        id: previous
        shell: bash
        run: |
          previous_release=""
          for attempt in 1 2 3; do
            previous_release="$(ssh synapse-production 'cat /var/www/synapse-shared/current-release')" && break
            echo "SSH attempt $attempt failed; retrying in 10 seconds" >&2
            sleep 10
          done
          [[ "$previous_release" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{7,40}$ ]] \
            || { echo "Invalid active release id"; exit 2; }
          echo "release_id=$previous_release" >> "$GITHUB_OUTPUT"

      - name: Activate release
        id: activate
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ssh synapse-production \
              "sudo /usr/local/sbin/synapse-deploy deploy '${{ steps.package.outputs.release_id }}'"; then
              exit 0
            fi
            echo "Activation attempt $attempt failed; retrying in 15 seconds" >&2
            sleep 15
          done
          exit 1

      - name: Verify public release
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 15 \
            "https://www.synapseapp.web.id/api/health" >/dev/null
          curl --fail --silent --show-error --max-time 20 \
            "https://www.synapseapp.web.id/" >/dev/null

      - name: Roll back failed public release
        if: failure() && steps.activate.outcome == 'success'
        shell: bash
        env:
          PREVIOUS_RELEASE: ${{ steps.previous.outputs.release_id }}
        run: |
          for attempt in 1 2 3; do
            if ssh synapse-production \
              "sudo /usr/local/sbin/synapse-deploy rollback '$PREVIOUS_RELEASE'"; then
              exit 0
            fi
            echo "Rollback attempt $attempt failed; retrying in 15 seconds" >&2
            sleep 15
          done
          exit 1
